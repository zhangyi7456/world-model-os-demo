<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Model OS — Design Demo</title>
    <meta name="description" content="把宏观状态、因果机制、情景概率与组合风险预算连接成一个可验证、可追溯的研究系统。" />
    <meta property="og:title" content="World Model OS" />
    <meta property="og:description" content="State · Causal · Scenario · Risk — 只读研究 Demo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zhangyi7456.github.io/world-model-os-demo/" />
    <meta property="og:image" content="https://zhangyi7456.github.io/world-model-os-demo/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://zhangyi7456.github.io/world-model-os-demo/og.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail" aria-label="主导航">
        <a class="brand" href="#world" aria-label="World Model OS">
          <span class="brand-mark">W</span>
          <span><b>WORLD MODEL</b><small>OPERATING SYSTEM</small></span>
        </a>
        <nav>
          <a href="#world" data-route="world"><span>01</span>世界状态</a>
          <a href="#causal" data-route="causal"><span>02</span>因果地图</a>
          <a href="#scenario" data-route="scenario"><span>03</span>情景推演</a>
          <a href="#portfolio" data-route="portfolio"><span>04</span>组合暴露</a>
        </nav>
        <div class="rail-foot">
          <p>DATA SNAPSHOT</p>
          <strong id="snapshot-date">2026 · 09 · 11</strong>
          <span class="health"><i></i><span id="data-health">等待模型产物</span></span>
          <small class="release-boundary">只读研究 Demo<br />不构成投资建议</small>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div class="mobile-brand">WMOS</div>
          <div class="context">
            <button class="select-like" id="entity-cycle" title="切换当前分析实体">PRIMARY · US⌄</button>
            <button class="select-like">MEDIUM LOOP⌄</button>
            <button class="select-like">FIRST RELEASE⌄</button>
          </div>
          <div class="meta"><span id="data-mode" class="stale">DEMO FIXTURE</span><span id="model-version">MODEL —</span><span id="as-of-time">AS OF —</span><button id="data-health-trigger" aria-haspopup="dialog" aria-controls="data-drawer">数据健康</button></div>
        </header>
        <div id="app" aria-live="polite"></div>
      </main>
    </div>
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="data-drawer" id="data-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
      <header>
        <div><p class="eyebrow">DATA LINEAGE</p><h2 id="drawer-title">数据健康</h2></div>
        <button id="drawer-close" aria-label="关闭数据健康面板">×</button>
      </header>
      <div id="drawer-content"></div>
    </aside>
    <script src="./app.js"></script>
  </body>
</html>
